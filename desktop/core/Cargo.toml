[package]
name = "gbook-core"
description = "GBook library data, EPUB parsing and feed posts, shared by the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib"] }
sha1_smol = "1"
dirs = "7"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
