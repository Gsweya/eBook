[package]
name = "gbook"
description = "GBook: a lightweight eReader for EPUB and PDF with highlights, a feed of ideas and reading stats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
gbook-core = { path = "../core" }
getrandom = "0.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
poppler-rs = "0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
